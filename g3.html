<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>關卡 3 · SEL 辰光句型挑戰</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="hd"></div>
<div class="wrap">
  <div class="meta"><span id="stage"></span><span id="sc">0 分</span></div>
  <div class="bar"><i id="pb"></i></div>
  <div id="app"></div>
</div>

<script src="common.js"></script>
<script src="art.js"></script>
<script>
const me = APP.requireMe();
document.getElementById('hd').innerHTML =
  APP.header('關卡 3 · SEL 辰光句型挑戰', 'PART III ｜ 用學生的身分走一次', true);

const EMO = [
  { k:'happy',   zh:'開心 Happy' },
  { k:'sad',     zh:'難過 Sad' },
  { k:'angry',   zh:'生氣 Angry' },
  { k:'worried', zh:'擔心 Worried' },
];

/* ---------- 五種手勢：看圖選意思 ---------- */
const GEST = APP.shuffle([
  { art:'gFist', a:'全體安靜', o:['全體安靜','我有話要說','退一步想一想','看老師這邊'],
    why:'手舉拳頭 ＝ Silence。辰光五種手勢的第一個，也是全校最常用的一個。' },
  { art:'gPoint', a:'我有話要說', o:['我有話要說','全體安靜','時間到了','分組開始'],
    why:'手舉高、握拳比食指。把「插話」轉成一個安靜的動作——插話的孩子其實只是急著被看見。' },
  { art:'gBTT', a:'退一步、想一想、再說出來', o:['退一步、想一想、再說出來','排隊出教室','舉手發言','分組討論'],
    why:'BTT ＝ Back–Think–Tell。衝突現場最有用的一個。它不制止情緒，它只是延後那句話。' },
  { art:'gEyes', a:'老師說 eyes on me，學生回 eyes on you', o:['老師說 eyes on me，學生回 eyes on you','大家閉上眼睛','看黑板抄筆記','兩人互看討論'],
    why:'一問一答，兩秒鐘把全班的注意力收回來。國中導師借這一招，第一天就有感。' },
  { art:'gSit', a:'集會前先閉眼靜坐', o:['集會前先閉眼靜坐','睡午覺時間','考試作答中','低頭認錯'],
    why:'只要集會，就先閉眼靜坐——這是辰光「圍圈」的中段：閉眼精心等候。' },
]);

/* ---------- 跨科：那一分鐘你會做什麼 ---------- */
const MIN1 = APP.shuffle([
  { subj:'數學', q:'體育課剛下課，學生喘著氣衝進你的數學課。第一分鐘你做什麼？',
    o:['直接開始講今天的例題','帶三次泡泡呼吸，再說 Today we are going to…','先罵一輪，讓他們安靜'], a:1,
    why:'Reset ▸ Re-connect。把操場留在教室門外，再把狀態接上這一節課。這一分鐘，是 45 分鐘裡投報率最高的。' },
  { subj:'國文', q:'要讀一首很安靜的詩，但學生剛從福利社回來，還在講餅乾。',
    o:['先閉眼 10 秒，再問 What do you see in your mind?','直接抽背上一課','先發考卷壓一下'], a:0,
    why:'先重置，再連結。詩需要安靜——那就先給他們安靜，而不是要求他們安靜。' },
  { subj:'理化', q:'實驗課進行到一半，有兩組為了誰拿器材吵起來了。',
    o:['兩組各罰站五分鐘','比出 BTT 手勢，讓他們退一步、想一想、再說','直接把兩人拆開換組'], a:1,
    why:'BTT 不否認情緒，只是在「感覺」和「說出口」之間插入一秒。這一秒就是自我管理。' },
  { subj:'音樂', q:'合唱練到最後兩分鐘，你想好好收尾。',
    o:['準時下課，趕快去下一班','Check-out：I feel ___ when I sing.','交代回家要練三遍'], a:1,
    why:'Check-out 讓學習有個收尾。一句話、中英文都可以——重點是「我帶走了什麼」。' },
  { subj:'導師時間', q:'你想開始做 SEL，但每天只有 3 分鐘。第一步先做哪一個？',
    o:['先講一段 SEL 的理論讓學生了解','四情緒 check-in，一人比一個手勢','發一份情緒量表問卷'], a:1,
    why:'國中版本：把四情緒 check-in 放進導師時間的前 3 分鐘。不用全校同步，先讓 3 個願意的導師跑一學期。' },
]);

const VOCAB = [
  ['開心','happy'],['難過','sad'],['生氣','angry'],['擔心','worried'],
  ['平靜','calm'],['緊張','nervous'],['驕傲','proud'],['孤單','lonely'],
  ['興奮','excited'],['害怕','scared'],['感恩','grateful'],['困惑','confused'],
];
const ALLW = VOCAB.map(v=>v[1]);

let stage = 0, i = 0, score = 0, myEmo = null, vHit = 0, vMiss = 0, timer = null, rushPts = 0;
const RUSH_CAP = 30;
const MAX = 10 + GEST.length*7 + MIN1.length*8 + RUSH_CAP + 12;
const app = document.getElementById('app');
const STAGES = ['說明','Check-in','五種手勢','那一分鐘','詞彙快打','Check-out','完成'];

function meta(){
  document.getElementById('sc').textContent = score + ' 分';
  document.getElementById('stage').textContent = STAGES[stage];
  document.getElementById('pb').style.width = (stage/6*100) + '%';
}

/* ---------- 0 ---------- */
function intro(){
  stage=0; meta();
  app.innerHTML = `
    <div class="card">
      <h2>週一辰光 · 全校 5 分鐘</h2>
      <p class="muted">不需要外師、不需要教材費、不佔任何一節課。接下來你用學生的身分走一次。</p>
      <div class="card tint" style="padding:12px;margin-bottom:0">
        <b>Check-in</b> 情緒進場　▸　<b>Topic</b> 本週主題　▸　<b>Practice</b> 句型練習　▸　<b>Check-out</b> 一句話帶走
      </div>
    </div>
    <button onclick="stage=1;checkin()">Check-in 開始 →</button>`;
}

/* ---------- 1 Check-in（表情圖） ---------- */
function checkin(){
  meta();
  app.innerHTML = `
    <div class="card">
      <h2 class="center">How do you feel today?</h2>
      <p class="muted center" style="margin-bottom:14px">辰光的孩子每週一早上都要回答這一題。<br>四種情緒、四種顏色、四個手勢——一年級也做得到。</p>
      <div class="artgrid">
        ${EMO.map(e=>`<button class="artopt" onclick="setEmo('${e.k}',this)">${ART.face(e.k)}<div>${e.zh}</div></button>`).join('')}
      </div>
      <button id="cn" disabled onclick="stage=2;i=0;gest()">下一步 →</button>
    </div>`;
}
function setEmo(k, el){
  myEmo = k;
  document.querySelectorAll('.artopt').forEach(b=>b.classList.remove('right'));
  el.classList.add('right');
  document.getElementById('cn').disabled = false;
  if (score < 10) score += 10;
  meta();
}

/* ---------- 2 手勢看圖 ---------- */
function gest(){
  meta();
  const g = GEST[i];
  const opts = APP.shuffle([...g.o]); window._og = opts;
  app.innerHTML = `
    <div class="card">
      <span class="tag">辰光五種手勢　${i+1} / ${GEST.length}</span>
      <div class="artbox">${ART[g.art]()}</div>
      <div class="tiny center">這個手勢代表什麼？</div>
    </div>
    ${opts.map((o,k)=>`<button class="opt" onclick="pickG(${k})">${APP.esc(o)}</button>`).join('')}`;
}
function pickG(k){
  const g = GEST[i], opts = window._og, ok = opts[k] === g.a;
  if (ok) score += 7;
  document.querySelectorAll('.opt').forEach((b,idx)=>{ b.onclick=null;
    if (opts[idx]===g.a) b.classList.add('right'); else if (idx===k) b.classList.add('wrong'); else b.classList.add('dim'); });
  app.insertAdjacentHTML('beforeend',
    `<div class="fb ${ok?'ok':'no'}"><b>${ok?'答對 +7':'正解：'+APP.esc(g.a)}</b>${g.why}</div>
     <button onclick="nextG()">${i===GEST.length-1?'那一分鐘 →':'下一個手勢 →'}</button>`);
  meta(); window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
function nextG(){ i++; if(i>=GEST.length){ stage=3; i=0; minute(); } else gest(); window.scrollTo({top:0}); }

/* ---------- 3 跨科一分鐘 ---------- */
function minute(){
  meta();
  const c = MIN1[i];
  app.innerHTML = `
    <div class="card">
      <span class="tag a">${c.subj}課　${i+1} / ${MIN1.length}</span>
      <div style="font-size:16.5px;font-weight:700;margin:10px 0;line-height:1.55">${APP.esc(c.q)}</div>
    </div>
    ${c.o.map((o,k)=>`<button class="opt" onclick="pickM(${k})">${APP.esc(o)}</button>`).join('')}`;
}
function pickM(k){
  const c = MIN1[i], ok = k === c.a;
  if (ok) score += 8;
  document.querySelectorAll('.opt').forEach((b,idx)=>{ b.onclick=null;
    if (idx===c.a) b.classList.add('right'); else if (idx===k) b.classList.add('wrong'); else b.classList.add('dim'); });
  app.insertAdjacentHTML('beforeend',
    `<div class="fb ${ok?'ok':'no'}"><b>${ok?'答對 +8':'比較好的做法：'+APP.esc(c.o[c.a])}</b>${c.why}</div>
     <button onclick="nextM()">${i===MIN1.length-1?'60 秒快打 →':'下一個情境 →'}</button>`);
  meta(); window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
function nextM(){ i++; if(i>=MIN1.length){ stage=4; rushIntro(); } else minute(); window.scrollTo({top:0}); }

/* ---------- 4 詞彙快打 ---------- */
function rushIntro(){
  meta();
  app.innerHTML = `
    <div class="card center">
      <h2>60 秒 · 情緒詞彙快打</h2>
      ${ART.face('happy')}
      <p class="muted">看中文選英文。答對 +2、答錯 −1。<br>辰光的孩子只需要記四個字；今天多送你八個。</p>
      <button class="amber" onclick="rushStart()">開始（60 秒）</button>
    </div>`;
}
let tLeft = 60, rushOn = false;
function rushStart(){
  rushOn = true; tLeft = 60; vHit = 0; vMiss = 0; rushPts = 0;
  timer = setInterval(()=>{ tLeft--; const el=document.getElementById('tm');
    if(el) el.textContent = tLeft + ' 秒';
    if(tLeft<=0){ clearInterval(timer); rushEnd(); } }, 1000);
  rushQ();
}
function rushQ(){
  if(!rushOn) return;
  const pair = VOCAB[Math.floor(Math.random()*VOCAB.length)];
  const opts = APP.shuffle([pair[1], ...APP.shuffle(ALLW.filter(w=>w!==pair[1])).slice(0,3)]);
  app.innerHTML = `
    <div class="card center">
      <div style="display:flex;justify-content:space-between;font-weight:800">
        <span style="color:var(--ok)">✓ ${vHit}</span><span id="tm" style="color:var(--err)">${tLeft} 秒</span>
      </div>
      <div style="font-size:38px;font-weight:800;margin:16px 0;color:var(--teal)">${pair[0]}</div>
    </div>
    ${opts.map(o=>`<button class="opt center" style="text-align:center" onclick="rushPick('${o}','${pair[1]}')">${o}</button>`).join('')}`;
}
function rushPick(pick, ans){
  if(pick===ans){ vHit++; if(rushPts < RUSH_CAP){ rushPts += 2; score += 2; } }
  else { vMiss++; if(rushPts > 0){ rushPts--; score = Math.max(0, score-1); } }
  meta(); rushQ();
}
function rushEnd(){
  rushOn = false; stage = 5; meta();
  app.innerHTML = `
    <div class="card center">
      <h2>時間到</h2>
      <div style="font-size:44px;font-weight:800;color:var(--teal)">${vHit}</div>
      <div class="muted">答對 ${vHit} 題 · 答錯 ${vMiss} 題</div>
    </div>
    <div class="card warm">
      <h3>為什麼 SEL 是雙語最好的載體？</h3>
      <p class="tiny" style="margin:0">情緒詞彙只有四個：happy, sad, angry, worried。學科詞彙動輒二十個。<br>
      門檻低、重複率高、情境是真的、而且沒有標準答案——所以學生不怕說錯。</p>
    </div>
    <button onclick="checkout()">最後一步 · Check-out →</button>`;
}

/* ---------- 5 Check-out ---------- */
function checkout(){
  meta();
  app.innerHTML = `
    <div class="card">
      <h2>Check-out · 一句話帶走</h2>
      <p class="muted">辰光每週一的最後一步。中文說感受，英語喊口號。</p>
      <label>我現在覺得＿＿＿。</label>
      <input id="fe" maxlength="30" placeholder="例：有點被提醒到">
      <label>I am ＿＿＿.（用一個形容詞描述你自己）</label>
      <input id="ia" maxlength="20" placeholder="例：curious / tired / ready">
      <label>I can ＿＿＿.（回學校後你可以做的一件小事）</label>
      <input id="ic" maxlength="60" placeholder="例：try a 3-minute check-in with my class">
      <button onclick="finish()">送出並看結果 →</button>
    </div>`;
  window.scrollTo({top:0});
}

async function finish(){
  const g = id => document.getElementById(id).value.trim();
  const fe = g('fe'), ia = g('ia'), ic = g('ic');
  if (fe) score += 4; if (ia) score += 4; if (ic) score += 4;
  stage = 6; meta();
  app.innerHTML = `
    <div class="card center">
      <div class="tiny">關卡 3 完成</div>
      <div style="font-size:52px;font-weight:800;color:var(--teal);line-height:1.1">${score}</div>
      <div class="muted">滿分 ${MAX} 分</div>
      ${myEmo ? ART.face(myEmo) : ''}
    </div>
    ${(ia||ic) ? `<div class="card warm center">
      <div class="tiny">你的 Best Bear 政見</div>
      <div style="font-size:20px;font-weight:800;margin:8px 0;line-height:1.5">
        I am ${APP.esc(ia||'___')}.<br>I can ${APP.esc(ic||'___')}.</div>
      <div class="tiny">這句話會出現在講台的文字牆上</div>
    </div>` : ''}
    <div class="card dark">
      <h3>回學校可以馬上做的</h3>
      <p class="tiny" style="color:#cfe0de">
      <b style="color:#fff">導師版</b>　四情緒 check-in 放進導師時間或班會的前 3 分鐘<br>
      <b style="color:#fff">科任版</b>　Check-in ▸ 重置 ▸ 再連結 ▸ Check-out，課的頭尾各一分鐘<br>
      <b style="color:#fff">全校版</b>　先挑 Silence 與 Eyes on me 兩個手勢，統一用一學期</p>
    </div>
    <a class="btn" href="g4.html">前往關卡 4 · 校長的兩難 →</a>
    <a class="btn ghost" href="index.html">回到首頁</a>
    <div class="tiny center" id="sent">上傳中…</div>`;
  const r = await APP.send('g3', score, MAX, { emotion: myEmo, feel: fe, iam: ia, ican: ic, vocab: vHit });
  document.getElementById('sent').textContent =
    r.ok ? '✓ 已送到主持人畫面（情緒雲 ＋ 文字牆）' : (r.offline ? '（離線模式：只存在這支手機）' : '上傳失敗，已存在本機');
}

intro();
</script>
</body>
</html>
