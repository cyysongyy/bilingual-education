<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>關卡 1 · 三種語言分類挑戰</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="hd"></div>
<div class="wrap">
  <div class="meta"><span id="stage">準備開始</span><span id="sc">0 分</span></div>
  <div class="bar"><i id="pb"></i></div>
  <div id="app"></div>
</div>

<script src="common.js"></script>
<script>
const me = APP.requireMe();
document.getElementById('hd').innerHTML =
  APP.header('關卡 1 · 三種語言分類挑戰', 'PART I ｜ Language OF / FOR / THROUGH', true);

/* ---------------- 題庫 ---------------- */
const R1 = APP.shuffle([
  { t:'bamboo brush 毛筆 · rice paper 宣紙 · brush washer 筆洗桶', a:'OF',
    why:'學科的關鍵字彙。沒有這些字，學生就無法談論這個單元的內容——這是 Language OF learning。（興南美術沉浸式課程實例）' },
  { t:'repel 相斥 · attract 相吸 · N pole / S pole', a:'OF',
    why:'三年級自然「神奇磁力」的核心字彙，屬於學科本身的語言。' },
  { t:'tempo · note · rest · 2 beats · rhythm', a:'OF',
    why:'四年級音樂「一拍擊合」的專業字彙。學科概念的名字，就是 Language OF learning。' },
  { t:'numerator 分子 · denominator 分母 · equals', a:'OF',
    why:'數學單元的關鍵語言。備課時第一個要決定的，就是這五個字。' },
  { t:'Let\'s form a group of three.', a:'FOR',
    why:'這是為了「完成活動」而需要的語言，不是學科內容本身——Language FOR learning。' },
  { t:'Can I help you? · Whose turn is it? · You go first.', a:'FOR',
    why:'小組合作時的互動語言。pair work、asking questions 都屬於這一類。' },
  { t:'I agree with you, because ___.', a:'FOR',
    why:'討論與下結論用的語言（debating / drawing conclusion），可以事先備妥並張貼在教室。' },
  { t:'Raise your hand if you are done.', a:'FOR',
    why:'課室指令。老師會在每一堂課重複的話，屬於 Language FOR learning。' },
  { t:'學生突然舉手問：「老師，那如果三個磁鐵疊在一起呢？」', a:'THROUGH',
    why:'你備不到這一句。這是在學習過程中「長出來」的語言——Language THROUGH learning，只能現場接住。' },
  { t:'學生在聯絡簿寫：「我也會用英語買東西，好有趣。」', a:'THROUGH',
    why:'興南低年級的真實紀錄。學習之後自己生出來的語言，個別差異大、無法預測。' },
  { t:'學生把 repel 用在形容兩個同學吵架', a:'THROUGH',
    why:'學生把學科字彙遷移到生活情境——這是最珍貴的一種語言，也完全無法事先規劃。' },
  { t:'學生問：「Teacher, why is my group wrong?」', a:'THROUGH',
    why:'學生為了理解自己的錯誤而自己造的句。老師唯一能做的準備，是願意說「我們一起查」。' },
]);

const R2 = [
  { q:'哪一種模式的「主角是學科老師」，學科目標第一、語言目標第二？',
    o:['CLIL','EMI','Immersion','ESL / EFL'], a:0,
    why:'CLIL = Content and Language Integrated Learning。它不要求老師英語很好，只要求老師把一個單元的關鍵語言想清楚——這是公立國中小唯一可大規模推行的模式。' },
  { q:'下列哪一項「不是」雙語教育？',
    o:['數學課用英語說 2 times 5 is 10','體育課用英語帶暖身操','英語課教學生拼 mother 這個字','社會課用英語討論 SDGs'], a:2,
    why:'英語課本身語言就是「內容」，那是 ESL / EFL，不是雙語教育。雙語是「用英語做學科的事」。' },
  { q:'雙語課的期末評量，最不該出現的是？',
    o:['答案寫中文也算對','用畫圖表達概念','考學生能不能正確拼出 density','小組口頭報告'], a:2,
    why:'「不要把評量英語能力的重點放在檢測學生是否能完成字彙拼讀或理解文法句型」——那是英語課的事。興南第一版考卷就是這樣踩坑的。' },
  { q:'CLIL 的 4C 中，最常被忽略、一旦沒設計課就會變成單字背誦的是？',
    o:['Content 內涵','Cognition 認知','Communication 溝通','Culture 文化'], a:1,
    why:'Cognition 就是「學生要用什麼層次的思考」。填不出 Cognition 那一欄，這堂課就還不是 CLIL。' },
];

const LABELS = {
  OF:   { t:'Language OF learning',      zh:'學習的語言（學科關鍵字彙／句構）', c:'var(--teal)' },
  FOR:  { t:'Language FOR learning',     zh:'為了完成活動所需要的語言',        c:'var(--teal2)' },
  THROUGH:{ t:'Language THROUGH learning', zh:'學習中長出來、無法預測的語言',  c:'var(--amber)' },
};

let i = 0, score = 0, phase = 1, wrong = [];
const TOTAL = R1.length + R2.length;
const app = document.getElementById('app');

function meta(){
  document.getElementById('sc').textContent = score + ' 分';
  document.getElementById('stage').textContent =
    phase === 0 ? '說明' : (phase === 3 ? '完成' : `第 ${i+1} / ${phase===1?R1.length:R2.length} 題　·　${phase===1?'分類':'名詞'}`);
  const doneN = phase===1 ? i : (phase===2 ? R1.length + i : TOTAL);
  document.getElementById('pb').style.width = (doneN / TOTAL * 100) + '%';
}

function intro(){
  phase = 0; meta();
  app.innerHTML = `
    <div class="card">
      <h2>備課時，你能掌握的只有前兩種</h2>
      <p class="muted">興南 108 學年度請雲林國小文湘娥老師來分享時留下的架構，後來變成我們所有教案的分類法。</p>
      ${Object.entries(LABELS).map(([k,v])=>`
        <div class="card tint" style="margin-bottom:8px;padding:13px">
          <div style="font-weight:800;color:${v.c}">${v.t}</div>
          <div class="tiny">${v.zh}</div>
        </div>`).join('')}
      <button onclick="start()">開始挑戰（12 張卡 + 4 題）</button>
    </div>`;
}

function start(){ phase = 1; i = 0; score = 0; wrong = []; q1(); }

function q1(){
  meta();
  const c = R1[i];
  app.innerHTML = `
    <div class="card">
      <div class="tiny" style="color:var(--teal2);font-weight:700">這句話／這組字，屬於哪一種語言？</div>
      <div style="font-size:18px;font-weight:700;margin:12px 0 4px;line-height:1.5">${APP.esc(c.t)}</div>
    </div>
    ${Object.entries(LABELS).map(([k,v])=>`
      <button class="opt" onclick="pick1('${k}')">
        <span style="color:${v.c}">${v.t}</span>
        <small>${v.zh}</small>
      </button>`).join('')}`;
}

function pick1(k){
  const c = R1[i];
  const ok = k === c.a;
  if (ok) score += 5; else wrong.push(c.t);
  document.querySelectorAll('.opt').forEach((b, idx) => {
    const key = Object.keys(LABELS)[idx];
    b.onclick = null;
    if (key === c.a) b.classList.add('right');
    else if (key === k) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  app.insertAdjacentHTML('beforeend', `
    <div class="fb ${ok?'ok':'no'}">
      <b>${ok ? '答對了 +5' : '正解：' + LABELS[c.a].t}</b>${c.why}
    </div>
    <button onclick="next1()">${i === R1.length-1 ? '進入第二輪 →' : '下一題 →'}</button>`);
  window.scrollTo({ top: document.body.scrollHeight, behavior:'smooth' });
}
function next1(){
  i++;
  if (i >= R1.length) { phase = 2; i = 0; q2(); } else q1();
  window.scrollTo({top:0});
}

function q2(){
  meta();
  const c = R2[i];
  app.innerHTML = `
    <div class="card">
      <div class="tiny" style="color:var(--amberD);font-weight:700">第二輪 · 名詞與觀念辨識</div>
      <div style="font-size:17px;font-weight:700;margin:10px 0;line-height:1.5">${APP.esc(c.q)}</div>
    </div>
    ${c.o.map((t,idx)=>`<button class="opt" onclick="pick2(${idx})">${APP.esc(t)}</button>`).join('')}`;
}
function pick2(k){
  const c = R2[i];
  const ok = k === c.a;
  if (ok) score += 10; else wrong.push(c.q);
  document.querySelectorAll('.opt').forEach((b, idx) => {
    b.onclick = null;
    if (idx === c.a) b.classList.add('right');
    else if (idx === k) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  app.insertAdjacentHTML('beforeend', `
    <div class="fb ${ok?'ok':'no'}"><b>${ok?'答對了 +10':'正解：'+APP.esc(c.o[c.a])}</b>${c.why}</div>
    <button onclick="next2()">${i === R2.length-1 ? '看結果 →' : '下一題 →'}</button>`);
  window.scrollTo({ top: document.body.scrollHeight, behavior:'smooth' });
}
function next2(){ i++; if (i >= R2.length) done(); else { q2(); window.scrollTo({top:0}); } }

const MAX = R1.length*5 + R2.length*10;

async function done(){
  phase = 3; meta();
  const pct = Math.round(score / MAX * 100);
  const rank = pct >= 90 ? '你已經可以幫學校辦共備了' :
               pct >= 70 ? '觀念很穩，剩下的是實作' :
               pct >= 50 ? '方向對了，回頭再看一次「三種語言」那張' :
                           '沒關係——這正是今天要處理的事';
  app.innerHTML = `
    <div class="card center">
      <div class="tiny">關卡 1 完成</div>
      <div style="font-size:52px;font-weight:800;color:var(--teal);line-height:1.1">${score}</div>
      <div class="muted">滿分 ${MAX} 分　·　正確率 ${pct}%</div>
      <div style="font-weight:700;color:var(--amberD);margin-top:8px">${rank}</div>
    </div>
    <div class="card warm">
      <h3>帶回學校的一句話</h3>
      <p>備課時你能掌握的只有前兩種。第三種，靠的是老師願不願意在課堂上說<b>「我也不確定，我們一起查」</b>。</p>
    </div>
    ${wrong.length ? `<div class="card"><h3>你答錯的（值得再看一次）</h3>
      <ul class="muted" style="padding-left:18px;margin:0">${wrong.map(w=>`<li>${APP.esc(w)}</li>`).join('')}</ul></div>` : ''}
    <div class="card dark"><h3>下一步</h3>
      <p class="tiny" style="color:#cfe0de">拿出你下個月要教的一個單元，寫下 5 個關鍵字、3 句提問、1 個產出句型。<br>關卡 2 會帶你做完這件事。</p></div>
    <a class="btn" href="g2.html">前往關卡 2 · CLIL 教案拼裝廠 →</a>
    <a class="btn ghost" href="index.html">回到首頁</a>
    <div class="tiny center" id="sent">上傳中…</div>`;
  const r = await APP.send('g1', score, MAX, { pct, wrongCount: wrong.length });
  document.getElementById('sent').textContent =
    r.ok ? '✓ 成績已送到主持人畫面' : (r.offline ? '（離線模式：成績只存在這支手機）' : '上傳失敗，成績已存在本機');
}

intro();
</script>
</body>
</html>
